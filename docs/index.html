<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java Scripting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--panel2:#f0f2f5;--text:#1b1f24;--muted:#5b6470;--line:#e2e5ea;
  --accent:#16a34a;--accent2:#0ea5e9;--accent3:#a855f7;--code:#0f172a;--codetext:#e2e8f0;--hl:#fde68a;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f14;--panel:#111821;--panel2:#16202b;--text:#e6edf3;--muted:#8b98a7;--line:#1f2b38;
    --accent:#3fdc7c;--accent2:#38bdf8;--accent3:#c084fc;--code:#070b10;--codetext:#d7e3ee;--hl:#5b4a12;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0b0f14;--panel:#111821;--panel2:#16202b;--text:#e6edf3;--muted:#8b98a7;--line:#1f2b38;
  --accent:#3fdc7c;--accent2:#38bdf8;--accent3:#c084fc;--code:#070b10;--codetext:#d7e3ee;--hl:#5b4a12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif}
code,.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
a{color:inherit}

header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;white-space:nowrap}
.brand .prompt{font-family:"JetBrains Mono",monospace;color:var(--accent)}
.brand .cursor{display:inline-block;width:9px;height:18px;background:var(--accent);vertical-align:-3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:11px 44px 11px 40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;outline:none;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:12px "JetBrains Mono",monospace;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--panel2)}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:17px}
.chiprow{max-width:1280px;margin:0 auto;padding:0 16px 12px;display:flex;gap:12px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;flex:none}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer;font:500 13px Inter,sans-serif}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#04120a}
.count{color:var(--muted);font-size:13px;white-space:nowrap}

.layout{max-width:1280px;margin:0 auto;padding:20px 16px 80px;display:grid;grid-template-columns:260px 1fr;gap:28px}
nav.toc{position:sticky;top:140px;align-self:start;max-height:calc(100vh - 160px);overflow:auto;padding-right:6px}
.toc h4{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.toc a{display:block;text-decoration:none;color:var(--muted);font-size:13.5px;padding:4px 10px;border-left:2px solid var(--line)}
.toc a:hover,.toc a.active{color:var(--text);border-color:var(--accent)}
.toc a.hidden{display:none}
.toc a{display:flex;align-items:center;gap:8px}
.toc .e{width:20px;text-align:center}
.toc .n,.secthead .n{margin-left:auto;font:12px "JetBrains Mono",monospace;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.secthead .n{margin-left:0}
.cat{margin-bottom:36px}

.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font:700 28px "JetBrains Mono",monospace}
.stat span{color:var(--muted);font-size:13px}
.stat:nth-child(1) b{color:var(--accent)}.stat:nth-child(2) b{color:var(--accent2)}.stat:nth-child(3) b{color:var(--accent3)}

.secthead{display:flex;align-items:baseline;gap:12px;margin:34px 0 4px}
.secthead h2{margin:0;font-size:26px}
.sectdesc{color:var(--muted);margin:0 0 14px}
.tema{margin:22px 0 30px}
.tema h3{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.tema h3::before{content:"#";font-family:"JetBrains Mono",monospace;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.card .name{font:700 17px "JetBrains Mono",monospace;color:var(--accent);word-break:break-word}
.card.usage .name{color:var(--accent2)}
.card .desc{margin:0;color:var(--text)}
.ex{position:relative;background:var(--code);color:var(--codetext);border-radius:10px;padding:10px 40px 10px 12px;font:13px/1.5 "JetBrains Mono",monospace;overflow-x:auto;white-space:pre}
.ex::before{content:"$ ";color:#3fdc7c}
.copy{position:absolute;top:6px;right:6px;border:0;background:rgba(255,255,255,.08);color:#cbd5e1;border-radius:7px;width:28px;height:26px;cursor:pointer;font-size:13px}
.copy:hover{background:rgba(255,255,255,.18)}
.copy.ok{color:#3fdc7c}
.params{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:10px}
.params .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.param{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.param code.flag{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12.5px;color:var(--accent3);white-space:pre-wrap;word-break:break-all;max-width:170px}
.param p{margin:0;font-size:13.5px;color:var(--muted)}
.param .ex{grid-column:1/-1;font-size:12.5px;padding:7px 38px 7px 10px}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:60px 0;display:none}
.totop{position:fixed;right:18px;bottom:18px;border-radius:999px;width:44px;height:44px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;box-shadow:var(--shadow);font-size:18px}
footer{color:var(--muted);font-size:13px;text-align:center;padding:30px 0 0}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav.toc{display:none}
  .hero{grid-template-columns:repeat(3,1fr)}
  .stat b{font-size:22px}
  .grid{grid-template-columns:1fr}
  .search kbd{display:none}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="prompt">~$</span> java-scripting<span class="cursor"></span></div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search a keyword, parameter or description…" autocomplete="off" aria-label="Search">
      <kbd>/</kbd>
    </label>
    <button class="iconbtn" id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </div>
  <div class="chiprow"><div class="chips" id="chips"></div><div id="countbox"></div></div>
</header>

<div class="layout">
  <nav class="toc" id="toc"></nav>
  <main>
    <div class="hero" id="hero"></div>
    <div id="content"></div>
    <div class="empty" id="empty">😶 Nothing matches your search.</div>
    <footer>Companion to <a href="https://github.com/TrueOwl-Override/Linux-Commands">Linux-Commands</a> · <a href="https://github.com/TrueOwl-Override/Bash-Scripting-From-Scratch">Bash-Scripting-From-Scratch</a> · <span class="mono">python3 scripts/build.py</span></footer>
  </main>
</div>
<button class="totop" onclick="scrollTo({top:0})" aria-label="Back to top">↑</button>

<script>
const DATA = {"categories": [{"name": "Program Structure", "emoji": "🏗️", "desc": "How a Java file is put together: classes, access, inheritance, imports, braces and semicolons.", "id": "program-structure", "commands": [{"name": "class", "desc": "Defines a class: the container where all Java code lives", "ex": "public class HelloWorld extends OpMode { }", "category": "Program Structure", "params": []}, {"name": "public", "desc": "Access modifier: lets other classes and the robot's system use the class or method", "ex": "public void init() { }", "category": "Program Structure", "params": [{"flag": "(no public)", "desc": "Access only inside the same package; the robot's system couldn't load the OpMode", "ex": "class Prueba { }"}]}, {"name": "extends", "desc": "Inheritance: the child class gets everything the parent class already has", "ex": "public class HelloWorld extends OpMode { }", "category": "Program Structure", "params": [{"flag": "OpMode", "desc": "FTC SDK base class: gives you init(), loop(), telemetry and hardware access", "ex": "public class HelloWorld extends OpMode { }"}]}, {"name": "import", "desc": "Brings in a class from a library (like the FTC SDK) so you can use it in the file", "ex": "import com.qualcomm.robotcore.eventloop.opmode.OpMode;", "category": "Program Structure", "params": [{"flag": "com.qualcomm.robotcore.eventloop.opmode.OpMode", "desc": "Brings in the OpMode class from the FTC SDK", "ex": "import com.qualcomm.robotcore.eventloop.opmode.OpMode;"}, {"flag": "com.qualcomm.robotcore.eventloop.opmode.TeleOp", "desc": "Brings in the @TeleOp annotation", "ex": "import com.qualcomm.robotcore.eventloop.opmode.TeleOp;"}, {"flag": "com.qualcomm.robotcore.eventloop.opmode.Disabled", "desc": "Brings in the @Disabled annotation", "ex": "import com.qualcomm.robotcore.eventloop.opmode.Disabled;"}, {"flag": "com.qualcomm.robotcore.eventloop.opmode.Autonomous", "desc": "Brings in the @Autonomous annotation", "ex": "import com.qualcomm.robotcore.eventloop.opmode.Autonomous;"}]}, {"name": "{ }", "desc": "Braces: mark where a class or method starts and ends; they always come in pairs", "ex": "public void loop() { }", "category": "Program Structure", "params": []}, {"name": ";", "desc": "Ends every statement; lines that open a brace { don't take one", "ex": "String saludo = \"Hola\";", "category": "Program Structure", "params": [{"flag": "(after })", "desc": "No semicolon after a closing brace", "ex": "public void loop() { }"}, {"flag": "(in comments)", "desc": "Inside a comment the ; is ignored like everything else", "ex": "// x = 5;"}]}, {"name": "PascalCase", "desc": "Naming convention for classes: every word starts with a capital letter", "ex": "public class SensorColor { }", "category": "Program Structure", "params": []}, {"name": "File name = class name", "desc": "A public class must have the same name as its .java file, capital letters included", "ex": "HelloWorld.java → public class HelloWorld { }", "category": "Program Structure", "params": []}, {"name": "Case sensitivity", "desc": "Java tells upper and lower case apart: potencia and Potencia are different names; keywords are always lowercase", "ex": "int potencia = 1; // Potencia would fail: it doesn't exist", "category": "Program Structure", "params": []}, {"name": "Whitespace", "desc": "Java ignores spaces, tabs and line breaks; blocks are marked by braces, not indentation", "ex": "int a = 1; int b = 2;", "category": "Program Structure", "params": []}, {"name": "( )", "desc": "Every opening parenthesis needs a closing one; if one is missing, the program won't compile", "ex": "telemetry.addData(\"Nombre\", \"Ashton\");", "category": "Program Structure", "params": []}]}, {"name": "Comments", "emoji": "💬", "desc": "Notes for humans that the compiler skips: single-line, block and Javadoc comments.", "id": "comments", "commands": [{"name": "//", "desc": "Single-line comment: the compiler ignores everything after it on that line", "ex": "double velocidad = 0.5; // potencia del motor (50 %)", "category": "Comments", "params": []}, {"name": "/* */", "desc": "Block comment: ignores everything between /* and */, even across several lines", "ex": "/* Espera 500 ms a que el sensor se estabilice */", "category": "Comments", "params": [{"flag": "(nested)", "desc": "You can't put one /* */ inside another: the first */ closes the whole comment", "ex": "/* uno /* dos */"}]}, {"name": "/** */", "desc": "Javadoc: a block comment that tools read to generate documentation and hover tooltips", "ex": "/** Se ejecuta una vez al presionar INIT. */", "category": "Comments", "params": []}]}, {"name": "Annotations", "emoji": "🏷️", "desc": "Labels that start with @ and tell the compiler or the robot how to treat your code.", "id": "annotations", "commands": [{"name": "@ (annotation)", "desc": "Metadata that describes the code to the compiler or the system; it doesn't run anything", "ex": "@Override", "category": "Annotations", "params": []}, {"name": "@Override", "desc": "Says you're replacing a method from the parent class; the compiler flags it if the name is misspelled", "ex": "@Override public void init() { }", "category": "Annotations", "params": []}, {"name": "@TeleOp", "desc": "Registers the OpMode as a driver-controlled program so it shows up on the Driver Station", "ex": "@TeleOp", "category": "Annotations", "params": []}, {"name": "@Disabled", "desc": "Hides the OpMode from the Driver Station menu without deleting it (handy for tests)", "ex": "@Disabled", "category": "Annotations", "params": []}, {"name": "@Autonomous", "desc": "Registers the OpMode in the Driver Station's Autonomous list instead of TeleOp", "ex": "@Autonomous", "category": "Annotations", "params": []}]}, {"name": "Methods", "emoji": "⚙️", "desc": "Blocks of code that do a job: return types and the OpMode lifecycle methods init() and loop().", "id": "methods", "commands": [{"name": "void", "desc": "Return type: the method does its job but gives no value back", "ex": "public void init() { }", "category": "Methods", "params": [{"flag": "int", "desc": "If the method returns a whole number, swap void for int and use return", "ex": "public int sumar() { return 5; }"}]}, {"name": "return", "desc": "Sends a value back from a method that isn't void and ends it", "ex": "public int sumar() { return 5; }", "category": "Methods", "params": []}, {"name": "init()", "desc": "Runs once when INIT is pressed; used to get the robot ready", "ex": "public void init() { telemetry.addData(\"Estado\", \"Listo\"); }", "category": "Methods", "params": [{"flag": "( )", "desc": "The parentheses take the method's parameters; empty if it takes none", "ex": "public void init() { }"}]}, {"name": "loop()", "desc": "Repeats about 50 times per second while the OpMode is running", "ex": "public void loop() { telemetry.addData(\"Tiempo\", getRuntime()); }", "category": "Methods", "params": [{"flag": "(reading the gamepad)", "desc": "Read the controller inside loop() to see every change, about 50 times per second", "ex": "public void loop() { telemetry.addData(\"A\", gamepad1.a); }"}]}]}, {"name": "Telemetry", "emoji": "📡", "desc": "Send data from the robot to the Driver Station screen to see what it's doing.", "id": "telemetry", "commands": [{"name": "telemetry.addData()", "desc": "Sends a label and a value to the Driver Station screen for debugging", "ex": "telemetry.addData(\"Hello\", \"World\");", "category": "Telemetry", "params": [{"flag": "caption", "desc": "First argument: the label shown on the left of the screen", "ex": "telemetry.addData(\"Distancia\", 25);"}, {"flag": "value", "desc": "Second argument: the data to show (text, number or variable)", "ex": "telemetry.addData(\"Velocidad\", 0.5);"}, {"flag": "(with an operation)", "desc": "The value can be a calculation: it's computed and the result is shown", "ex": "telemetry.addData(\"Suma gatillos\", gamepad1.left_trigger + gamepad1.right_trigger);"}]}]}, {"name": "Variables", "emoji": "📦", "desc": "Named boxes in memory: how to name, declare, assign and initialize them.", "id": "variables", "commands": [{"name": "Variable", "desc": "A named spot in memory that holds a value; its size depends on its type", "ex": "int teamNumber;", "category": "Variables", "params": []}, {"name": "camelCase", "desc": "Naming convention for variables: start lowercase, every next word starts with a capital", "ex": "double motorSpeed = 0.5;", "category": "Variables", "params": []}, {"name": "Declaration", "desc": "type name; reserves the space with a type and a name; required before using the variable", "ex": "int teamNumber;", "category": "Variables", "params": []}, {"name": "= (assignment)", "desc": "Stores the value on the right in the variable on the left; it doesn't mean equality", "ex": "teamNumber = 16072;", "category": "Variables", "params": [{"flag": "(value on the left)", "desc": "The left side must always be a variable: 10 = x; won't compile", "ex": "int x = 10; // 10 = x; no compila"}]}, {"name": "Reassignment", "desc": "A variable can get new values many times; it always keeps the latest and the old one is lost", "ex": "int x = 5; x = 10; // x vale 10", "category": "Variables", "params": []}, {"name": "Initialization", "desc": "type name = value; declares and assigns in one line; the most common way", "ex": "double motorSpeed = 0.5;", "category": "Variables", "params": []}, {"name": "Default values", "desc": "Class fields with no value start at 0 (numbers) or false (boolean); a local variable must be assigned before it is read", "ex": "public class Robot { int vueltas; boolean listo; }", "category": "Variables", "params": [{"flag": "(local variable)", "desc": "Inside a method there is no default: assign it before using it", "ex": "int vueltas = 0;"}]}]}, {"name": "Strings & Types", "emoji": "🔤", "desc": "Working with text and data types.", "id": "strings-types", "commands": [{"name": ".equals()", "desc": "Compares the text of two Strings; == only checks whether they are the same object", "ex": "String a = \"hola\"; boolean igual = a.equals(\"hola\");", "category": "Strings & Types", "params": []}, {"name": "Primitive types", "desc": "Java's 8 built-in types: byte, short, int, long, float, double, char and boolean; FTC mostly uses int, double and boolean", "ex": "int a = 1; double b = 0.5; boolean c = true;", "category": "Strings & Types", "params": []}, {"name": "byte", "desc": "8-bit whole number: from -128 to 127", "ex": "byte nivel = 100;", "category": "Strings & Types", "params": []}, {"name": "short", "desc": "16-bit whole number (-32,768 to 32,767); almost never used in FTC", "ex": "short temperatura = 1200;", "category": "Strings & Types", "params": []}, {"name": "char", "desc": "A single Unicode character, in single quotes", "ex": "char letra = 'A';", "category": "Strings & Types", "params": []}, {"name": "int", "desc": "32-bit whole number (-2,147,483,648 to 2,147,483,647); the standard for counting", "ex": "int teamNumber = 16072;", "category": "Strings & Types", "params": [{"flag": "(with decimals)", "desc": "An int can't hold decimals: int x = 0.5; is an error, use double", "ex": "double x = 0.5; // int x = 0.5; no compila"}]}, {"name": "long", "desc": "64-bit whole number (up to ~9 quintillion); use it when an int isn't big enough", "ex": "long granos = 3000000000L;", "category": "Strings & Types", "params": [{"flag": "L (suffix)", "desc": "A number too big for an int needs an L at the end; without it, it won't compile", "ex": "long granos = 3000000000L;"}]}, {"name": "float", "desc": "32-bit decimal (~7 digits of precision); smaller than a double", "ex": "float pi = 3.14f;", "category": "Strings & Types", "params": [{"flag": "f (suffix)", "desc": "Without the f, 3.14 is treated as a double and won't compile", "ex": "float pi = 3.14f;"}]}, {"name": "double", "desc": "64-bit decimal (~15-17 digits); Java's default decimal type and what sensors return", "ex": "double motorSpeed = 0.5;", "category": "Strings & Types", "params": []}, {"name": "boolean", "desc": "Holds only true or false; it doesn't accept 1 or 0 and can't be added", "ex": "boolean touchSensorPressed = true;", "category": "Strings & Types", "params": [{"flag": "(with 1 / 0)", "desc": "Java doesn't turn numbers into booleans: boolean b = 1; is an error", "ex": "boolean b = true; // boolean b = 1; no compila"}]}, {"name": "true / false", "desc": "Java's logical values; always lowercase (True won't compile)", "ex": "boolean esRojo = true;", "category": "Strings & Types", "params": []}, {"name": "String", "desc": "Class for holding text; written with a capital S and the value goes in double quotes", "ex": "String myName = \"Alan Smith\";", "category": "Strings & Types", "params": [{"flag": "(with single quotes)", "desc": "A text in ' ' won't compile: single quotes are only for a char", "ex": "String nombre = \"Alan\"; // String nombre = 'Alan'; no compila"}, {"flag": "(lowercase s)", "desc": "string doesn't exist in Java: you get a cannot find symbol error", "ex": "String ok = \"sí\"; // string mal = \"no\"; no compila"}]}, {"name": "\" \" (double quotes)", "desc": "Wrap a text (String); single quotes ' ' are only for a char", "ex": "String nombre = \"Ashton\"; char inicial = 'A';", "category": "Strings & Types", "params": []}, {"name": "Class vs. primitive", "desc": "Primitives (int, double) are lowercase; String is a class, so it starts with a capital letter", "ex": "int x = 5; String texto = \"cinco\";", "category": "Strings & Types", "params": []}, {"name": "Concatenation (+)", "desc": "Joins texts, or text with numbers, into one String; it doesn't add spaces on its own", "ex": "String saludo = \"Hola, \" + myName;", "category": "Strings & Types", "params": [{"flag": "(no space)", "desc": "If you don't put the space inside the quotes, the text comes out stuck together", "ex": "String pegado = \"Hola\" + \"Alan\"; // \"HolaAlan\""}, {"flag": "(with a number)", "desc": "If one side is a String, Java turns the number into text automatically", "ex": "String equipo = \"Equipo: \" + 16072; // \"Equipo: 16072\""}]}]}, {"name": "Scope", "emoji": "🔭", "desc": "Where a variable lives: blocks, braces and which code can see each variable.", "id": "scope", "commands": [{"name": "Scope", "desc": "Where a variable exists: it's born at its declaration and dies at the } of the block where it was created", "ex": "int x = 5; { int y = 4; x = x + y; } // aquí y ya no existe", "category": "Scope", "params": [{"flag": "(outside the block)", "desc": "Using a variable after its } gives a cannot find symbol error", "ex": "int x = 5; { int y = 4; } x = 10; // x = y; no compila"}]}, {"name": "Block", "desc": "Any section of code between { and }; each block has its own scope", "ex": "{ int y = 4; }", "category": "Scope", "params": []}, {"name": "Block hierarchy", "desc": "Variables from an outer block are visible in inner blocks, but not the other way around", "ex": "int x = 5; { int y = x + 1; }", "category": "Scope", "params": []}]}, {"name": "Gamepad", "emoji": "🎮", "desc": "Read the driver's controllers: buttons, joysticks and triggers through gamepad1 and gamepad2.", "id": "gamepad", "commands": [{"name": "gamepad1 / gamepad2", "desc": "The two controllers the Driver Station recognizes; each one is a Gamepad object", "ex": "boolean disparar = gamepad2.a;", "category": "Gamepad", "params": [{"flag": "Start + A", "desc": "Pressed together, they register the controller as gamepad1", "ex": "boolean a1 = gamepad1.a;"}, {"flag": "Start + B", "desc": "Pressed together, they register the controller as gamepad2", "ex": "boolean a2 = gamepad2.a;"}]}, {"name": "Dot access (.)", "desc": "controller.part: the dot reads one part of the controller; read it as \"of\"", "ex": "double gatillo = gamepad1.right_trigger;", "category": "Gamepad", "params": []}, {"name": "Buttons (a, b, x, y)", "desc": "Return a boolean: true while pressed, false when released", "ex": "boolean botonA = gamepad1.a;", "category": "Gamepad", "params": [{"flag": "dpad_up / dpad_down / dpad_left / dpad_right", "desc": "The D-pad works as four boolean buttons", "ex": "boolean arriba = gamepad1.dpad_up;"}, {"flag": "left_bumper / right_bumper", "desc": "Top buttons; also boolean", "ex": "boolean bumper = gamepad1.right_bumper;"}, {"flag": "start / back", "desc": "Center buttons; also boolean", "ex": "boolean inicio = gamepad1.start;"}, {"flag": "left_stick_button / right_stick_button", "desc": "true when you press the stick down", "ex": "boolean click = gamepad1.left_stick_button;"}]}, {"name": "Joysticks", "desc": "Return a decimal from -1.0 to 1.0; 0.0 is the center", "ex": "double avance = gamepad1.left_stick_y;", "category": "Gamepad", "params": [{"flag": "_x (horizontal axis)", "desc": "Left is -1.0 and right is 1.0", "ex": "double giro = gamepad1.left_stick_x;"}, {"flag": "_y (vertical axis)", "desc": "Up is -1.0 and down is 1.0 (the opposite of what you'd expect)", "ex": "double avance = -gamepad1.left_stick_y;"}, {"flag": "left_ / right_", "desc": "Picks the left or the right stick", "ex": "double giro = gamepad1.right_stick_x;"}, {"flag": "(float type)", "desc": "In the FTC SDK they are float; they fit in a double with no problem", "ex": "double y = gamepad1.left_stick_y;"}]}, {"name": "Triggers", "desc": "Decimal from 0.0 (released) to 1.0 (pressed all the way); never negative", "ex": "double succion = gamepad1.right_trigger;", "category": "Gamepad", "params": []}]}, {"name": "Math Operators", "emoji": "➗", "desc": "Do math with numbers: arithmetic, negation, integer division, modulo and order of operations.", "id": "math-operators", "commands": [{"name": "+ (addition)", "desc": "Adds two numbers", "ex": "int total = 3 + 4; // 7", "category": "Math Operators", "params": []}, {"name": "- (subtraction)", "desc": "Subtracts the number on the right from the one on the left", "ex": "double diferencia = 1.0 - 0.25; // 0.75", "category": "Math Operators", "params": []}, {"name": "- (negation)", "desc": "Unary operator: flips the sign of a single value", "ex": "double avance = -gamepad1.left_stick_y;", "category": "Math Operators", "params": [{"flag": "(0 - x)", "desc": "-x is the same as 0 - x", "ex": "double x = 0.8; double y = 0 - x; // -0.8"}]}, {"name": "* (multiplication)", "desc": "Multiplies; the symbol is always required", "ex": "double potencia = 0.8 * 0.5; // 0.4", "category": "Math Operators", "params": [{"flag": "(no symbol)", "desc": "You can't put numbers side by side: 3x isn't valid, write 3 * x", "ex": "int x = 4; int y = 3 * x; // 12"}]}, {"name": "/ (division)", "desc": "Divides; if both numbers are int, the result is an int too", "ex": "double mitad = 1.0 / 2; // 0.5", "category": "Math Operators", "params": [{"flag": "(with a decimal)", "desc": "One number with a decimal point is enough to avoid truncation", "ex": "double r = 5.0 / 2; // 2.5"}]}, {"name": "Truncation (int / int)", "desc": "int / int throws away the decimal part; it doesn't round", "ex": "int r = 5 / 2; // 2", "category": "Math Operators", "params": [{"flag": "(result 0)", "desc": "If the divisor is bigger, int / int gives 0", "ex": "int r = 9 / 10; // 0"}, {"flag": "(stopped motor)", "desc": "A power calculated with int / int can be 0 and leave the robot still", "ex": "double potencia = 1 / 2; // 0.0, usa 1.0 / 2"}]}, {"name": "% (modulo)", "desc": "Gives the remainder (what's left over) of a whole-number division", "ex": "int resto = 11 % 4; // 3", "category": "Math Operators", "params": [{"flag": "(n % 2 == 0)", "desc": "Tells you whether a number is even", "ex": "boolean esPar = 8 % 2 == 0; // true"}, {"flag": "(cyclic counter)", "desc": "Makes a counter go back to 0 when it reaches a limit", "ex": "int paso = 3; paso = (paso + 1) % 4; // vuelve a 0"}]}, {"name": "Order of operations", "desc": "* / % are solved before + -; ties go left to right", "ex": "int r = 10 + 5 * 2; // 20", "category": "Math Operators", "params": []}, {"name": "( ) (precedence)", "desc": "Whatever is inside category": "Shortcut Operators", "params": [{"flag": "(with double)", "desc": "Scales a power value without losing decimals", "ex": "double potencia = 0.8; potencia *= 0.5; // 0.4"}]}, {"name": "/= (divide and assign)", "desc": "Divides and stores in the same variable; with int it truncates too", "ex": "int galletas = 10; galletas /= 2; // 5", "category": "Shortcut Operators", "params": [{"flag": "(with int)", "desc": "If the variable is an int, the decimal part is thrown away", "ex": "int x = 7; x /= 2; // 3"}]}, {"name": "%= (remainder and assign)", "desc": "Stores in the variable the remainder of dividing it", "ex": "int segundos = 125; segundos %= 60; // 5", "category": "Shortcut Operators", "params": [{"flag": "(circular range)", "desc": "Keeps a value inside a range that starts over", "ex": "int paso = 5; paso %= 4; // 1"}]}]}], "stats": {"commands": 71, "parameters": 49, "categories": 11}};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

// Theme
(function(){
  let t = null; try { t = localStorage.getItem("theme"); } catch(e){}
  if (t) document.documentElement.dataset.theme = t;
  $("#theme").onclick = () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch(e){}
  };
})();

const exBlock = (ex) => ex ? `<div class="ex"><span class="t">${esc(ex)}</span><button class="copy" title="Copy" aria-label="Copy">⧉</button></div>` : "";

function cardHTML(c){
  const params = c.params.length ? `<div class="params"><div class="lbl">Parameters</div>${
    c.params.map(p=>`<div class="param"><code class="flag">${esc(p.flag)}</code><p>${esc(p.desc)}</p>${exBlock(p.ex)}</div>`).join("")}</div>` : "";
  return `<article class="card"><div class="name">${esc(c.name)}</div>${c.desc?`<p class="desc">${esc(c.desc)}</p>`:""}${exBlock(c.ex)}${params}</article>`;
}

// Render
const cats = DATA.categories;
cats.forEach(cat => cat.commands.forEach(c => c.text = norm([c.name,c.desc,c.ex,...c.params.flatMap(p=>[p.flag,p.desc,p.ex])].join(" "))));
$("#hero").innerHTML = `
  <div class="stat"><b>${DATA.stats.commands}</b><span>items</span></div>
  <div class="stat"><b>${DATA.stats.parameters}</b><span>parameters</span></div>
  <div class="stat"><b>${DATA.stats.categories}</b><span>categories</span></div>`;

$("#content").innerHTML = cats.map(cat =>
  `<section class="cat" id="${cat.id}"><div class="secthead"><h2>${cat.emoji} ${esc(cat.name)}</h2><span class="n">${cat.commands.length}</span></div>
   <p class="sectdesc">${esc(cat.desc)}</p><div class="grid">${cat.commands.map(cardHTML).join("")}</div></section>`).join("");
$("#toc").innerHTML = `<h4>Categories</h4>` + cats.map(cat =>
  `<a href="#${cat.id}" data-id="${cat.id}"><span class="e">${cat.emoji}</span>${esc(cat.name)}<span class="n">${cat.commands.length}</span></a>`).join("");

cats.forEach(cat => {
  cat.el = document.getElementById(cat.id);
  const cardEls = cat.el.querySelectorAll(".card");
  cat.commands.forEach((c, j) => { c.el = cardEls[j]; c.orig = cardEls[j].innerHTML; });
});

// Category chips
const active = new Set();
$("#chips").innerHTML = cats.map(c => `<button class="chip" aria-pressed="false" data-s="${c.id}">${c.emoji} ${esc(c.name)}</button>`).join("");
$("#countbox").innerHTML = `<span class="count" id="count"></span>`;
document.querySelectorAll(".chip").forEach(b => b.onclick = () => {
  const s = b.dataset.s; active.has(s) ? active.delete(s) : active.add(s);
  b.setAttribute("aria-pressed", active.has(s)); apply();
});

function highlight(el, terms){
  if (!terms.length) return;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    if (n.parentElement.closest("button")) return;
    const txt = n.nodeValue, low = norm(txt);
    const ranges = [];
    terms.forEach(t => { let i = 0; while ((i = low.indexOf(t, i)) !== -1){ ranges.push([i, i + t.length]); i += t.length; } });
    if (!ranges.length) return;
    ranges.sort((a,b)=>a[0]-b[0]);
    const frag = document.createDocumentFragment(); let pos = 0;
    ranges.forEach(([a,b]) => { if (a < pos) return; frag.append(txt.slice(pos,a)); const m = document.createElement("mark"); m.textContent = txt.slice(a,b); frag.append(m); pos = b; });
    frag.append(txt.slice(pos)); n.replaceWith(frag);
  });
}

function apply(){
  const terms = norm($("#q").value).split(/\s+/).filter(Boolean);
  let shown = 0;
  cats.forEach(cat => {
    const catOk = !active.size || active.has(cat.id);
    let any = false;
    cat.commands.forEach(c => {
      const ok = catOk && terms.every(term => c.text.includes(term));
      c.el.style.display = ok ? "" : "none";
      c.el.innerHTML = c.orig;
      if (ok){ any = true; shown++; highlight(c.el, terms); }
    });
    cat.el.style.display = any ? "" : "none";
    document.querySelector(`.toc a[data-id="${cat.id}"]`).classList.toggle("hidden", !any);
  });
  $("#empty").style.display = shown ? "none" : "block";
  $("#count").textContent = `${shown} item${shown === 1 ? "" : "s"}`;
}
$("#q").addEventListener("input", apply);
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("#q")){ $("#q").value = ""; apply(); }
});

// Copy buttons
document.addEventListener("click", async e => {
  const b = e.target.closest(".copy"); if (!b) return;
  const text = b.parentElement.querySelector(".t").textContent;
  try { await navigator.clipboard.writeText(text); } catch(err){
    const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); try{document.execCommand("copy");}catch(_){} ta.remove();
  }
  b.textContent = "✓"; b.classList.add("ok"); setTimeout(() => { b.textContent = "⧉"; b.classList.remove("ok"); }, 1200);
});

// Active TOC link on scroll
const io = new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting){
    document.querySelectorAll(".toc a.active").forEach(a => a.classList.remove("active"));
    const a = document.querySelector(`.toc a[data-id="${en.target.id}"]`); if (a) a.classList.add("active");
  }});
}, {rootMargin: "-160px 0px -70% 0px"});
cats.forEach(c => io.observe(c.el));

apply();
</script>
